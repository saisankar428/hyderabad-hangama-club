version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hhc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hangama}
      POSTGRES_USER: ${POSTGRES_USER:-hangama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hangama_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hangama}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hhc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hhc_api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hangama}:${POSTGRES_PASSWORD:-hangama_secret}@db:5432/${POSTGRES_DB:-hangama}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: hhc_web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

  nginx:
    image: nginx:alpine
    container_name: hhc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
