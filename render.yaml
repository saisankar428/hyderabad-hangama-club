# Optional: deploy the FastAPI backend on Render (free tier available).
# Vercel hosts the Next.js frontend only — the API must run elsewhere with PostgreSQL.
#
# After deploy, set in Render env:
#   API_BASE_URL=https://<this-service>.onrender.com
#   CORS_ORIGINS=https://<your-vercel-app>.vercel.app
#   ADMIN_DASHBOARD_URL=https://<your-vercel-app>.vercel.app/admin
#
# Docs: docs/DEPLOYMENT.md

services:
  - type: web
    name: hyderabad-hangama-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hyderabad-hangama-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_DASHBOARD_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PAYMENT_MODE
        value: UPI_MANUAL
      - key: UPI_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AISENSY_API_KEY
        sync: false

databases:
  - name: hyderabad-hangama-db
    plan: free
    databaseName: hangama
    user: hangama
