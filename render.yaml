# Render Blueprint — FastAPI backend (Supabase Postgres + Storage, not Render DB)
# Docs: docs/DEPLOYMENT_READY.md

services:
  - type: web
    name: hyderabad-hangama-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: payment-screenshots
      - key: API_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_DASHBOARD_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PAYMENT_MODE
        value: UPI_MANUAL
      - key: UPI_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AISENSY_API_KEY
        sync: false
